[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trackforge"
version = "0.1.0"
description = "Local-first audio metadata and library workflow toolkit."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "GidRadium" }]
dependencies = [
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
    "platformdirs>=4.3,<5",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "rapidfuzz>=3.9,<4",
    "rich>=13.9,<15",
    "sqlalchemy>=2.0,<3",
    "socksio>=1.0,<2",
    "typer>=0.12.5,<1",
]

[project.optional-dependencies]
# Mutagen is GPL-2.0-or-later; it is imported only by the tagging adapter and
# never by domain/application/pipeline code (see the license-boundary contract).
tagging = ["mutagen>=1.47"]
# Optional cross-encoder runtime. Lexical ranking works without this extra.
ranker = [
    "onnxruntime>=1.18,<2",
    "tokenizers>=0.20,<1",
    "numpy>=1.26,<3",
]
# CPU Whisper inference and explicit model downloads.  Model weights are not
# package dependencies and stay under the models directory.
asr = [
    "faster-whisper>=1.1,<2",
    "huggingface-hub>=0.24,<1",
    # Hugging Face Hub downloads through requests; SOCKS proxies need PySocks
    # even when httpx already has socksio installed.
    "pysocks>=1.7,<2",
    # faster-whisper 1.2.x passes ``metadata_errors`` to av.open; PyAV 19
    # removed that keyword, so keep the decoder on the compatible series.
    "av>=11,<16",
]
# Optional CPU Demucs separation.  Weights are not package dependencies and
# are downloaded only by `trackforge models download demucs`.
stems = [
    "demucs>=4.0,<5",
    "torch>=2.2,<3",
    "torchaudio>=2.2,<3",
]

[project.scripts]
trackforge = "trackforge.interfaces.cli.main:app"

[dependency-groups]
dev = [
    "import-linter>=2.1,<3",
    "mypy>=1.11,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "respx>=0.21,<1",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trackforge"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["trackforge"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-m 'not network and not slow'"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: fast tests without I/O boundaries",
    "contract: architecture, interface, and license contracts",
    "integration: tests requiring local external tools or services",
    "network: tests that use the network",
    "slow: long-running tests",
    "spike: exploratory tests not part of the regular suite",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
