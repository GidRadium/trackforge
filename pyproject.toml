[project]
name = "trackforge"
version = "0.1.0"
description = "Tooling to collect, verify, and write metadata for audio and video files."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "GidRadium", email = "73718589+GidRadium@users.noreply.github.com" },
]
dependencies = [
    "typer>=0.15",
]

[project.scripts]
tfg = "trackforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trackforge"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
