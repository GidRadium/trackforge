[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trackforge"
version = "0.1.0"
description = "Local-first audio metadata and library workflow toolkit."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "GidRadium" }]
dependencies = [
    "alembic>=1.13,<2",
    "platformdirs>=4.3,<5",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "rich>=13.9,<15",
    "sqlalchemy>=2.0,<3",
    "typer>=0.12.5,<1",
]

[project.scripts]
trackforge = "trackforge.interfaces.cli.main:app"

[dependency-groups]
dev = [
    "import-linter>=2.1,<3",
    "mypy>=1.11,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trackforge"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["trackforge"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-m 'not network and not slow'"
testpaths = ["tests"]
markers = [
    "unit: fast tests without I/O boundaries",
    "contract: architecture, interface, and license contracts",
    "integration: tests requiring local external tools or services",
    "network: tests that use the network",
    "slow: long-running tests",
    "spike: exploratory tests not part of the regular suite",
]
